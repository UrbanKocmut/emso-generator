name: Check and deploy Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Includes build:check, so stale committed assets fail before deployment.
      - run: npm test
      - name: Stage the static site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          mkdir _site
          cp -R assets fonts _site/
          if [ -d sprites ]; then cp -R sprites _site/; fi
          cp index.html zasebnost.html manifest.webmanifest service-worker.js precache-manifest.js CNAME logo.png _site/
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked static files
        id: deployment
        uses: actions/deploy-pages@v4
